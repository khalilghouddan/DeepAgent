services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: deep-agent/deep-agent:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SEARXNG_URL: http://searxng:8080/search
      SOURCES_JSON_PATH: /app/outputs/sources_history.json
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      searxng:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["uvicorn", "web_api:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: deep-agent/frontend:latest
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
