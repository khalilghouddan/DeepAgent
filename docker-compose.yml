services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    expose:
      - "8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10

  crawl4ai:
    build:
      context: "/mnt/c/Users/dell 7470/Desktop/crawl4ai_service-master"
      dockerfile: Dockerfile
    image: crawl4ai-crawl-api:local
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      CORS_ORIGINS: "*"
    expose:
      - "8001"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: deep-agent/deep-agent:latest
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SEARXNG_URL: http://searxng:8080/search
      CRAWL4AI_URL: ${CRAWL4AI_URL:-http://crawl4ai:8001}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_started
    ports:
      - "8000:8000"
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: deep-agent/frontend:latest
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
