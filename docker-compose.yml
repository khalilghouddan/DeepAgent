services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: deep-agent/deep-agent:latest
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SEARXNG_URL: http://host.docker.internal:8080/search
      CRAWL4AI_URL: http://host.docker.internal:8007
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      CRAWL4AI_BATCH_SIZE: ${CRAWL4AI_BATCH_SIZE:-10}
      CRAWL4AI_TIMEOUT: ${CRAWL4AI_TIMEOUT:-180}
    volumes:
      - ./api:/app/api
      - ./cli:/app/cli
      - ./config:/app/config
      - ./db:/app/db
      - ./model_config:/app/model_config
      - ./research_agent:/app/research_agent
      - ./outputs:/app/outputs
    ports:
      - "8000:8000"
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: deep-agent/frontend:latest
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
